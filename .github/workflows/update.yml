name: Update adblock lists

on:
  schedule:
    # Daily 16:00 UTC ≈ 00:00 SGT next day; change to cron "0 */6 * * *" for every 6h
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch upstreams and merge
        run: python3 merge.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/ out/STATS.md sources/.gitkeep 2>/dev/null || true
          git add out/
          if git diff --staged --quiet; then
            echo "No list changes"
          else
            git commit -m "chore: refresh merged DOMAIN-SET $(date -u +%Y-%m-%dT%H%MZ)"
            git push
          fi
